<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520"><style>text{font-family:Arial,Helvetica,sans-serif;fill:#222}.title{font-size:26px;font-weight:700}.sub,.label{font-size:13px;fill:#555}.axis{stroke:#777;stroke-width:1}.box{fill:#72b7b2;fill-opacity:.5;stroke:#333;stroke-width:2}</style><rect width="900" height="520" fill="white"/><text x="60" y="48" class="title">FRP e valores extremos</text><text x="60" y="74" class="sub">Resumo pelo intervalo interquartil (IQR)</text><line x1="100" y1="280" x2="366.5" y2="280" class="axis"/><line x1="100" y1="250" x2="100" y2="310" class="axis"/><line x1="366.5" y1="250" x2="366.5" y2="310" class="axis"/><rect x="130.8" y="220" width="94.3" height="120" class="box"/><line x1="164.4" y1="220" x2="164.4" y2="340" stroke="#222" stroke-width="3"/><text x="130.8" y="200" text-anchor="middle" class="label">Q1 2,64</text><text x="164.4" y="370" text-anchor="middle" class="label">Mediana 5,52</text><text x="225.1" y="200" text-anchor="middle" class="label">Q3 10,72</text><text x="366.5" y="200" text-anchor="middle" class="label">Limite IQR 22,84</text><line x1="100" y1="410" x2="800" y2="410" class="axis"/><text x="100" y="438" text-anchor="middle" class="label">0</text><text x="216.7" y="438" text-anchor="middle" class="label">10</text><text x="333.3" y="438" text-anchor="middle" class="label">20</text><text x="450" y="438" text-anchor="middle" class="label">30</text><text x="566.7" y="438" text-anchor="middle" class="label">40</text><text x="683.3" y="438" text-anchor="middle" class="label">50</text><text x="800" y="438" text-anchor="middle" class="label">60</text><text x="60" y="500" class="label">Acima do limite superior, os registros são tratados como outliers pelo critério de 1,5 × IQR.</text></svg>